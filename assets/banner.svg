<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>

    <style>
      .network-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .network-line-reverse {
        stroke-dasharray: 6, 6;
        animation: flowDashRev 15s linear infinite;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 300; }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0.2; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes packetMove1 {
        0% { transform: translate(0px, 0px); opacity: 0.2; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(450px, -70px); opacity: 0.2; }
      }
      @keyframes packetMove2 {
        0% { transform: translate(0px, 0px); opacity: 0.2; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(-380px, 60px); opacity: 0.2; }
      }
      .ring-pulse {
        transform-origin: center;
        animation: pulseRing 3.5s ease-in-out infinite;
      }
      .packet-1 {
        animation: packetMove1 4.5s ease-in-out infinite;
      }
      .packet-2 {
        animation: packetMove2 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#glowCyan)" />
  <rect width="1200" height="360" fill="url(#glowIndigo)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- 2. Dynamic Animated Network Connections (Backdrop Layer) -->
  <g opacity="0.45">
    <!-- Connecting curves between nodes -->
    <path d="M 120 80 Q 320 30, 580 90" fill="none" stroke="#38bdf8" stroke-width="1.8" class="network-line" />
    <path d="M 580 90 Q 860 140, 1080 70" fill="none" stroke="#818cf8" stroke-width="1.8" class="network-line" />
    <path d="M 1080 70 Q 950 240, 680 280" fill="none" stroke="#c084fc" stroke-width="1.8" class="network-line-reverse" />
    <path d="M 680 280 Q 380 310, 140 260" fill="none" stroke="#06b6d4" stroke-width="1.8" class="network-line-reverse" />
    <path d="M 140 260 Q 220 160, 580 90" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Animated Data Packets Traveling -->
    <g class="packet-1">
      <circle cx="120" cy="80" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
    <g class="packet-2">
      <circle cx="1080" cy="70" r="4.5" fill="#c084fc">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Pulsing Node 1 (Top Left) -->
    <g transform="translate(120, 80)">
      <circle cx="0" cy="0" r="18" fill="url(#nodeGlow)" class="ring-pulse" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    </g>
    <!-- Pulsing Node 2 (Top Right) -->
    <g transform="translate(1080, 70)">
      <circle cx="0" cy="0" r="20" fill="url(#nodeGlow)" class="ring-pulse" style="animation-delay: -1.2s;" />
      <circle cx="0" cy="0" r="5" fill="#818cf8" />
    </g>
    <!-- Pulsing Node 3 (Bottom Right) -->
    <g transform="translate(680, 280)">
      <circle cx="0" cy="0" r="16" fill="url(#nodeGlow)" class="ring-pulse" style="animation-delay: -2s;" />
      <circle cx="0" cy="0" r="4" fill="#c084fc" />
    </g>
    <!-- Pulsing Node 4 (Bottom Left) -->
    <g transform="translate(140, 260)">
      <circle cx="0" cy="0" r="16" fill="url(#nodeGlow)" class="ring-pulse" style="animation-delay: -0.6s;" />
      <circle cx="0" cy="0" r="4" fill="#06b6d4" />
    </g>
  </g>

  <!-- 3. Foreground Content Card with High Contrast Backdrop -->
  <!-- Semi-transparent backdrop ensures dynamic background never obscures foreground text -->
  <g transform="translate(100, 35)">
    <rect width="1000" height="290" rx="20" fill="#0b1329" fill-opacity="0.82" stroke="url(#accentBorder)" stroke-width="1.5" filter="url(#softShadow)" />

    <!-- Top Badge Pill -->
    <g transform="translate(375, 24)">
      <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="125" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">
        ⚡ CURATED ECOSYSTEM DIRECTORY
      </text>
    </g>

    <!-- Main Title -->
    <text x="500" y="112" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#textGlow)">
      Awesome File Sharing
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="500" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Top SaaS Platforms, P2P Protocols, Local Network &amp; Self-Hosted Transfer Tools
    </text>

    <!-- Divider Bar -->
    <line x1="280" y1="180" x2="720" y2="180" stroke="#334155" stroke-width="1" />

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(105, 206)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="90" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
          📡 Peer-to-Peer &amp; LAN
        </text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(198, 0)">
        <rect width="186" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
        <text x="93" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
          🔒 End-to-End Encrypted
        </text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(402, 0)">
        <rect width="186" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3" />
        <text x="93" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
          🚀 Open-Source Verified
        </text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(606, 0)">
        <rect width="182" height="38" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
        <text x="91" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">
          ☁️ SaaS &amp; Self-Hosted
        </text>
      </g>
    </g>

    <!-- Bottom Footer Meta -->
    <text x="500" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
      ✨ 100% Free Tiers &amp; Pricing Verified • Real-Time GitHub Stars • Zero Hidden Cloud Fees
    </text>
  </g>
</svg>
